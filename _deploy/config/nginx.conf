# nginx · estratto server block per hearth.travel
server {
  server_name hearth.travel;
  root /var/www/hearth/production;
  index index.html;
  error_page 404 /404.html;

  # redirect legacy
  location = /hearth-pass      { return 301 /pass; }
  location ^~ /hearth-pass/    { return 301 /pass; }
  location = /website-business { return 301 /attivita/sito; }
  location ^~ /website-business/ { return 301 /attivita/sito; }

  # route statiche: /territori → /territori/index.html
  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }

  location ~* \.(jpg|png|svg|mp4|otf|ttf)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
