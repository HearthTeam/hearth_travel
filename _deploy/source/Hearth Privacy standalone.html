document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

e>\n<style>:root{\n/* base — paper & ink */\n--ink:#151412;--ink-soft:#2b2926;--paper:#faf8f3;--white:#ffffff;--mist:#f1eee8;\n--grey-100:#e8e5df;--grey-200:#d6d2ca;--grey-300:#b5b0a7;--grey-400:#8a857c;--grey-500:#5f5b54;--grey-600:#3e3b36;\n/* territory accents — optional, ≤10% of a surface, never in Core chrome */\n--accent-terra:#b5533a;--accent-rosso:#e9573f;--accent-blu:#2f4f7a;--accent-giallo:#e2b73a;--accent-verde:#4f6b4a;\n--on-accent-terra:var(--paper);--on-accent-rosso:var(--ink);--on-accent-blu:var(--paper);--on-accent-giallo:var(--ink);--on-accent-verde:var(--paper);\n--accent:var(--accent-terra);--on-accent:var(--on-accent-terra);\n/* semantic states — desaturated, editorial */\n--state-success:#3f6b4a;--state-warning:#a8742c;--state-error:#a63a2b;--state-info:#3e5a80;\n/* semantic aliases */\n--color-background-canvas:var(--paper);--color-background-surface:var(--white);--color-background-subtle:var(--mist);--color-background-inverse:var(--ink);\n--color-text-primary:var(--ink);--color-text-secondary:var(--grey-500);--color-text-tertiary:var(--grey-500);--color-text-decorative:var(--grey-400);--color-text-inverse:var(--paper);--color-text-on-image:var(--paper);\n--color-border-hairline:rgba(21,20,18,.12);--color-border-default:var(--grey-200);--color-border-control:var(--grey-400);--color-border-strong:var(--ink);\n--color-action-primary:var(--ink);--color-action-primary-hover:var(--ink-soft);--color-action-primary-text:var(--paper);--color-action-secondary-hover:var(--mist);\n--color-focus-ring:var(--ink);\n--color-overlay-scrim:linear-gradient(180deg,rgba(21,20,18,0) 40%,rgba(21,20,18,.55) 100%);\n--color-material-glass:rgba(250,248,243,.82);--color-material-glass-dark:rgba(21,20,18,.6);\n--color-background-hover:var(--mist);--color-background-selected:var(--grey-100);\n}\n/* Core mode — operational tools. Pure white canvas, neutral (non-beige) greys. Paper stays available for Stories/Editions previews nested inside Core. Contrast on #FFF: Ink 18.41 .dc.html\">Attività<\u002Fa>\n      <a href=\"Hearth Creator.dc.html\">Creator<\u002Fa>\n      <a href=\"Hearth Pass.dc.html\">Hearth Pass<\u002Fa>\n    <\u002Fnav>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<main id=\"contenuto\" class=\"wrap\">\n  <div class=\"head\">\n    <div class=\"eyebrow\">Hearth / Informazioni legali<\u002Fdiv>\n    <h1>Privacy Policy<\u002Fh1>\n    <p class=\"sub\">Come trattiamo e proteggiamo i tuoi dati personali attraverso i servizi digitali Hearth.<\u002Fp>\n    <div class=\"date\">Ultimo aggiornamento: <time datetime=\"2026-10-08\">8 ottobre 2026<\u002Ftime><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"layout\">\n    <aside class=\"toc toc-d\" aria-label=\"Indice\">\n      <p class=\"toc-title\">Indice<\u002Fp>\n      <ol>\n        <li><a href=\"#introduzione\">Introduzione<\u002Fa><\u002Fli>\n        <li><a href=\"#titolare\">Titolare del trattamento<\u002Fa><\u002Fli>\n        <li><a href=\"#ambito\">Ambito di applicazione<\u002Fa><\u002Fli>\n        <li><a href=\"#dati\">Categorie di dati personali<\u002Fa><\u002Fli>\n        <li><a href=\"#creator\">Hearth Creator<\u002Fa><\u002Fli>\n        <li><a href=\"#persone\">Persone presenti nei contenuti<\u002Fa><\u002Fli>\n        <li><a href=\"#traveller\">Hearth Traveller<\u002Fa><\u002Fli>\n        <li><a href=\"#sito\">Sito web e altri servizi<\u002Fa><\u002Fli>\n        <li><a href=\"#basi\">Finalità e basi giuridiche<\u002Fa><\u002Fli>\n        <li><a href=\"#destinatari\">Fornitori e destinatari<\u002Fa><\u002Fli>\n        <li><a href=\"#trasferimenti\">Trasferimenti internazionali<\u002Fa><\u002Fli>\n        <li><a href=\"#conservazione\">Conservazione dei dati<\u002Fa><\u002Fli>\n        <li><a href=\"#cancellazione\">Cancellazione dell'account<\u002Fa><\u002Fli>\n        <li><a href=\"#sicurezza\">Sicurezza<\u002Fa><\u002Fli>\n        <li><a href=\"#diritti\">Diritti degli interessati<\u002Fa><\u002Fli>\n        <li><a href=\"#minori\">Minori<\u002Fa><\u002Fli>\n        <li><a href=\"#cookie\">Cookie e tecnologie analoghe<\u002Fa><\u002Fli>\n        <li><a href=\"#automatizzate\">Decisioni automatizzate<\u002Fa><\u002Fli>\n        <li><a href=\"#modifiche\">Modifiche dell'informativa<\u002Fa><\u002Fli>\n        <li><a href=\"#contatti\">Contatti<\u002Fa><\u002Fli>\n      <\u002Fol>\n    <\u002Faside>\n\n    <article class=\"doc\">\n      <details class=\"toc toc-m\">\n        <summary>Indice delle sezioni<\u002Fsummary>\n        <ol>\n          <li><a href=\"#introduzione\">Introduzione<\u002Fa><\u002Fli>\n          <li><a href=\"#titolare\">Titolare del trattamento<\u002Fa><\u002Fli>\n          <li><a href=\"#ambito\">Ambito di applicazione<\u002Fa><\u002Fli>\n          <li><a href=\"#dati\">Categorie di dati personali<\u002Fa><\u002Fli>\n          <li><a href=\"#creator\">Hearth Creator<\u002Fa><\u002Fli>\n          <li><a href=\"#persone\">Persone presenti nei contenuti<\u002Fa><\u002Fli>\n          <li><a href=\"#traveller\">Hearth Traveller<\u002Fa><\u002Fli>\n          <li><a href=\"#sito\">Sito web e altri servizi<\u002Fa><\u002Fli>\n          <li><a href=\"#basi\">Finalità e basi giuridiche<\u002Fa><\u002Fli>\n          <li><a href=\"#destinatari\">Fornitori e destinatari<\u002Fa><\u002Fli>\n          <li><a href=\"#trasferimenti\">Trasferimenti internazionali<\u002Fa><\u002Fli>\n          <li><a href=\"#conservazione\">Conservazione dei dati<\u002Fa><\u002Fli>\n          <li><a href=\"#cancellazione\">Cancellazione dell'account<\u002Fa><\u002Fli>\n          <li><a href=\"#sicurezza\">Sicurezza<\u002Fa><\u002Fli>\n          <li><a href=\"#diritti\">Diritti degli interessati<\u002Fa><\u002Fli>\n          <li><a href=\"#minori\">Minori<\u002Fa><\u002Fli>\n          <li><a href=\"#cookie\">Cookie e tecnologie analoghe<\u002Fa><\u002Fli>\n          <li><a href=\"#automatizzate\">Decisioni automatizzate<\u002Fa><\u002Fli>\n          <li><a href=\"#modifiche\">Modifiche dell'informativa<\u002Fa><\u002Fli>\n          <li><a href=\"#contatti\">Contatti<\u002Fa><\u002Fli>\n        <\u002Fol>\n      <\u002Fdetails>\n\n      <section id=\"introduzione\" aria-labelledby=\"h-introduzione\">\n        <h2 id=\"h-introduzione\"><span class=\"n\">01<\u002Fspan><span>Introduzione<\u002Fspan><\u002Fh2>\n        <p class=\"intro\">Hearth sviluppa servizi digitali per raccontare e valorizzare territori, persone e comunità: un sito, applicazioni per chi produce contenuti e per chi esplora i territori, strumenti per Comuni, organizzatori di eventi e attività locali.<\u002Fp>\n        <p>Per far funzionare questi servizi trattiamo dati personali. Questa informativa spiega quali dati trattiamo, perché, su quale base giuridica, con chi possono essere condivisi, per quanto tempo li conserviamo e quali diritti puoi esercitare, ai sensi degli articoli 13 e 14 del Regolamento (UE) 2016/679 («GDPR») e del D.lgs. 196/2003 («Codice Privacy»).<\u002Fp>\n        <p>Non tutti i dati descritti sono raccolti da tutti i servizi: il trattamento dipende dal servizio che usi e dalle funzionalità che attivi.<\u002Fp>\n      <\u002Fsection>\n\n      <section id=\"titolare\" aria-labelledby=\"h-titolare\">\n        <h2 id=\"h-titolare\"><span class=\"n\">02<\u002Fspan><span>Titolare del trattamento<\u002Fspan><\u002Fh2>\n        <dl class=\"facts\">\n          <dt>Ragione sociale<\u002Fdt><dd>Hearth S.r.l. Società Benefit<\u002Fdd>\n          <dt>Sede legale<\u002Fdt><dd>III Traversa Via Alvanella n. 4<br>83024 Monteforte Irpino (AV), Italia<\u002Fdd>\n          <dt>P. IVA e C.F.<\u002Fdt><dd>02960700645<\u002Fdd>\n          <dt>PEC<\u002Fdt><dd><a href=\"mailto:hearth@pec.net\">hearth@pec.net<\u002Fa><\u002Fdd>\n          <dt>Richieste privacy<\u002Fdt><dd><a href=\"mailto:massimiliano.imbimbo@hearth.email\">massimiliano.imbimbo@hearth.email<\u002Fa><\u002Fdd>\n          <dt>Sito<\u002Fdt><dd><a href=\"https://hearth.travel\">hearth.travel<\u002Fa><\u002Fdd>\n        <\u002Fdl>\n        <p>Per informazioni sul trattamento dei tuoi dati o per esercitare i tuoi diritti scrivi all'indirizzo indicato per le richieste privacy. La PEC è disponibile per comunicazioni formali; tieni presente che una casella PEC potrebbe non accettare messaggi inviati da indirizzi email ordinari.<\u002Fp>\n      <\u002Fsection>\n\n      <section id=\"ambito\" aria-labelledby=\"h-ambito\">\n        <h2 id=\"h-ambito\"><span class=\"n\">03<\u002Fspan><span>Ambito di applicazione<\u002Fspan><\u002Fh2>\n        <p>Questa informativa si applica a:<\u002Fp>\n        <ul>\n          <li>l'applicazione <strong>Hearth Creator<\u002Fstrong>;<\u002Fli>\n          <li>l'applicazione <strong>Hearth Traveller<\u002Fstrong>;<\u002Fli>\n          <li>il sito <strong>hearth.travel<\u002Fstrong>;<\u002Fli>\n          <li>gli altri servizi digitali di Hearth che richiamano espressamente questo documento.<\u002Fli>\n        <\u002Ful>\n        <p>Per singole funzionalità possono essere fornite informative integrative, che prevalgono su questo documento per quanto riguarda la funzionalità specifica.<\u002Fp>\n        <h3>Servizi per Comuni, enti e altri clienti<\u002Fh3>\n        <p>Hearth realizza anche strumenti per Comuni, Pro Loco, organizzatori di eventi e altri clienti. In questi casi Hearth non è necessariamente titolare del trattamento: per alcune attività può agire come <strong>responsabile del trattamento<\u002Fstrong> per conto dell'ente o del cliente, che resta titolare e definisce finalità e mezzi del trattamento.<\u002Fp>\n        <p>I ruoli dipendono dal singolo servizio e dagli accordi applicabili. Questa informativa generale non sostituisce le informative che l'ente o il cliente è tenuto a fornire per i trattamenti di cui è titolare.<\u002Fp>\n      <\u002Fsection>\n\n      <section id=\"dati\" aria-labelledby=\"h-dati\">\n        <h2 id=\"h-dati\"><span class=\"n\">04<\u002Fspan><span>Categorie di dati personali<\u002Fspan><\u002Fh2>\n        <h3>A. Dati identificativi e di account<\u002Fh3>\n        <p>Nome e cognome, indirizzo email, identificativi utente, dati del profilo, credenziali o identificativi di autenticazione, preferenze e impostazioni.<\u002Fp>\n        <h3>B. Dati tecnici<\u002Fh3>\n        <p>Tipo di dispositivo, sistema operativo, versione dell'app, log tecnici, dati di diagnostica, errori applicativi, dati sulle prestazioni e, quando trattato, indirizzo IP.<\u002Fp>\n        <h3>C. Contenuti<\u002Fh3>\n        <p>Fotografie, video ed eventuali registrazioni audio contenute nei video, testi e descrizioni, informazioni territoriali, metadati associati ai file, informazioni sulle persone e sulle attività raccontate.<\u002Fp>\n        <h3>D. Dati economici e fiscali<\u002Fh3>\n        <p>Importi, transazioni, accrediti, coordinate bancarie, codice fiscale, partita IVA quando presente, residenza fiscale e gli altri dati necessari agli adempimenti contabili e fiscali.<\u002Fp>\n        <h3>E. Dati di utilizzo e comunicazioni<\u002Fh3>\n        <p>Richieste di assistenza, comunicazioni con Hearth, interazioni con i servizi e, se previste, preferenze salvate.<\u002Fp>\n        <h3>Dati obbligatori e facoltativi<\u002Fh3>\n        <p>Alcuni dati sono necessari per creare un account, erogare un servizio o rispettare obblighi di legge: senza di essi non possiamo fornire il servizio o la funzionalità richiesta. Altri dati sono facoltativi e il loro mancato conferimento limita solo la funzionalità a cui si riferiscono. Al momento della raccolta indichiamo quali dati sono necessari.<\u002Fp>\n      <\u002Fsection>\n\n      <section id=\"creator\" aria-labelledby=\"h-creator\">\n        <h2 id=\"h-creator\"><span class=\"n\">05<\u002Fspan><span>Hearth Creator<\u002Fspan><\u002Fh2>\n        <p>Hearth Creator permette di realizzare, caricare, organizzare e condividere contenuti editoriali dedicati ai territori. I trattamenti descritti di seguito riguardano chi utilizza l'app come Creator.<\u002Fp>\n\n        <h3>A. Profilo Creator<\u002Fh3>\n        <p>Trattiamo i dati di registrazione, identificazione e gestione dell'account. Alcune informazioni restano riservate e sono visibili solo a te e a Hearth (ad esempio email, dati economici e fiscali, stato delle candidature). Altre possono essere visibili ad altri utenti o nei contenuti pubblicati, come il nome con cui firmi i contenuti o una breve presentazione, nella misura in cui l'app prevede e mostra questa visibilità.<\u002Fp>\n\n        <h3>B. Produzione e caricamento dei contenuti<\u002Fh3>\n        <p>Trattiamo le fotografie, i video, i testi, le descrizioni, le informazioni territoriali e i metadati che carichi. I contenuti possono essere sottoposti a verifica editoriale, a richieste di integrazione, ad approvazione e a pubblicazione.<\u002Fp>\n        <p>I file fotografici e video possono contenere metadati tecnici, come data, dispositivo e, se attiva sul tuo dispositivo, la posizione in cui sono stati realizzati.<\u002Fp>\n\n        <h3>C. Pubblicazione e distribuzione<\u002Fh3>\n        <p>I contenuti approvati possono essere pubblicati nei servizi Hearth e resi disponibili attraverso altri canali previsti dagli accordi applicabili, come guide digitali, siti web, applicazioni, strumenti di consultazione e canali autorizzati dei partner.<\u002Fp>\n        <p>Pubblicare un contenuto rende visibile ciò che il contenuto mostra o racconta. Questo è distinto dalla comunicazione a terzi dei tuoi dati personali di account, che avviene solo nei casi descritti nella sezione <a href=\"#destinatari\">Fornitori e destinatari<\u002Fa>. I diritti d'uso dei contenuti sono regolati dalle condizioni e dagli accordi applicabili, non da questa informativa.<\u002Fp>\n\n        <h3>D. Missioni<\u002Fh3>\n        <p>Per le attività commissionate o disponibili attraverso la piattaforma trattiamo i dati relativi alla partecipazione, ai contenuti consegnati, allo stato delle attività, alle scadenze, alle verifiche e ai compensi.<\u002Fp>\n\n        <h3>E. Wallet e revenue sharing<\u002Fh3>\n        <p>L'app utilizza un sistema di punti e accrediti per gestire le quote economiche riconosciute ai Creator. Trattiamo i dati necessari a registrare, calcolare e mostrare queste operazioni. Internamente le operazioni sono distinte per causale:<\u002Fp>\n        <ul>\n          <li><strong>quote riconducibili ai diritti sui contenuti<\u002Fstrong>, relative all'utilizzazione economica o alla licenza dei contenuti creativi, quando ne ricorrono i presupposti;<\u002Fli>\n          <li><strong>compensi per Missioni<\u002Fstrong>, riconosciuti per attività commissionate.<\u002Fli>\n        <\u002Ful>\n        <p>Questa informativa descrive il trattamento dei dati legati a queste operazioni. Le condizioni economiche e il trattamento fiscale dei compensi sono definiti dalle condizioni contrattuali e dalla normativa applicabile.<\u002Fp>\n\n        <h3>F. Pagamenti e dati fiscali<\u002Fh3>\n        <p>Per liquidare i compensi e adempiere agli obblighi contabili e fiscali raccogliamo i dati necessari: dati anagrafici, codice fiscale, partita IVA quando presente, residenza fiscale e coordinate bancarie per l'accredito. Non chiediamo dati che non siano necessari a queste finalità.<\u002Fp>\n\n        <h3>G. Permessi del dispositivo<\u002Fh3>\n        <p>Per realizzare e caricare contenuti l'app può chiedere l'accesso a:<\u002Fp>\n        <ul>\n          <li><strong>fotocamera<\u002Fstrong>, per scattare fotografie e girare video;<\u002Fli>\n          <li><strong>fotografie e video<\u002Fstrong>, per selezionare i file che scegli di caricare;<\u002Fli>\n          <li><strong>microfono<\u002Fstrong>, quando necessario per registrare l'audio dei video.<\u002Fli>\n        <\u002Ful>\n        <p>L'accesso avviene solo con l'autorizzazione che concedi nelle impostazioni del sistema operativo, che puoi revocare in qualsiasi momento, e nei limiti di quanto il sistema consente. Trattiamo i file che selezioni o realizzi attraverso l'app, non l'intera libreria del dispositivo.<\u002Fp>\n\n        <h3>H. Strumenti di supporto alla produzione e alla revisione<\u002Fh3>\n        <p>Hearth può utilizzare strumenti di supporto alla produzione e alla revisione dei contenuti, inclusi strumenti basati sull'intelligenza artificiale. Quando una funzionalità comporta l'invio di dati personali a un fornitore esterno di servizi di intelligenza artificiale, Hearth indica, nell'informativa integrativa della funzionalità o al momento dell'utilizzo, quali dati vengono trasmessi, per quale finalità, a quale fornitore, per quanto tempo sono conservati, se avvengono trasferimenti fuori dallo Spazio Economico Europeo e se il fornitore può utilizzare i dati per addestrare i propri modelli secondo le sue condizioni.<\u002Fp>\n      <\u002Fsection>\n\n      <section id=\"persone\" aria-labelledby=\"h-persone\">\n        <h2 id=\"h-persone\"><span class=\"n\">06<\u002Fspan><span>Persone presenti nei contenuti<\u002Fspan><\u002Fh2>\n        <p>I Creator raccontano artigiani, commercianti, residenti, persone legate alle tradizioni locali, partecipanti a eventi e altre persone identificabili. Fotografie, video e racconti possono quindi contenere dati personali di persone diverse dal Creator.<\u002Fp>\n        <p>Questa sezione è rivolta a queste persone ed è resa anche ai sensi dell'articolo 14 GDPR, per i dati non raccolti direttamente presso l'interessato.<\u002Fp>\n        <h3>Origine dei dati<\u002Fh3>\n        <p>I dati provengono dal Creator che ha realizzato il contenuto e, quando presenti, da informazioni fornite dalla persona stessa o dall'attività raccontata.<\u002Fp>\n        <h3>Dati trattati<\u002Fh3>\n        <p>Immagine e voce, nome o soprannome, ruolo o mestiere, attività svolta, luogo, informazioni contenute nel racconto.<\u002Fp>\n        <h3>Finalità<\u002Fh3>\n        <p>Documentare e raccontare territori, persone, mestieri e tradizioni, e rendere questi racconti disponibili nei servizi Hearth e nei canali descritti nella sezione 5.C.<\u002Fp>\n        <h3>Pubblicazione<\u002Fh3>\n        <p>Un contenuto viene pubblicato solo dopo la verifica editoriale. Il consenso alla ripresa raccolto dal Creator non esaurisce gli obblighi di Hearth: il diritto all'immagine, la riservatezza e la protezione dei dati personali sono valutati distintamente. Hearth presta particolare attenzione ai contenuti che ritraggono minori o che possono rivelare informazioni appartenenti a categorie particolari di dati (ad esempio salute, convinzioni religiose), che non vengono pubblicati senza una base giuridica adeguata.<\u002Fp>\n        <h3>I tuoi diritti<\u002Fh3>\n        <p>Se compari in un contenuto Hearth puoi chiederci di accedere ai dati che ti riguardano, di correggerli, di opporti al trattamento o di rimuovere il contenuto o la parte che ti riguarda. Scrivi a <a href=\"mailto:massimiliano.imbimbo@hearth.email\">massimiliano.imbimbo@hearth.email<\u002Fa> indicando il contenuto (indirizzo della pagina o descrizione) e la richiesta. Valutiamo ogni richiesta secondo il GDPR e ti rispondiamo nei termini indicati nella sezione <a href=\"#diritti\">Diritti degli interessati<\u002Fa>.<\u002Fp>\n      <\u002Fsection>\n\n      <section id=\"traveller\" aria-labelledby=\"h-traveller\">\n        <h2 id=\"h-traveller\"><span class=\"n\">07<\u002Fspan><span>Hearth Traveller<\u002Fspan><\u002Fh2>\n        <p>Hearth Traveller consente di esplorare contenuti, luoghi, persone, esperienze e territori. In base alle funzionalità che utilizzi, trattiamo i dati necessari a:<\u002Fp>\n        <ul>\n          <li>creare e gestire l'account;<\u002Fli>\n          <li>mostrarti i contenuti e consentirne la navigazione;<\u002Fli>\n          <li>salvare preferenze, guide e percorsi, quando usi queste funzionalità;<\u002Fli>\n          <li>gestire le interazioni con le funzionalità dell'app;<\u002Fli>\n          <li>gestire l'accesso alle funzionalità riservate.<\u002Fli>\n        <\u002Ful>\n        <h3>Posizione<\u002Fh3>\n        <p>Se una funzionalità utilizza la posizione del dispositivo, ad esempio per mostrarti ciò che si trova vicino a te, l'accesso avviene solo con il permesso concesso nelle impostazioni del sistema operativo, che puoi revocare in qualsiasi momento. Il permesso del sistema operativo è un'autorizzazione tecnica: la base giuridica del trattamento è indicata nella sezione <a href=\"#basi\">Finalità e basi giuridiche<\u002Fa>. L'eventuale conservazione della posizione e l'eventuale accesso in background, se previsti da una funzionalità, sono indicati al momento della richiesta del permesso.<\u002Fp>\n        <h3>Hearth Pass<\u002Fh3>\n        <p>Per l'acquisto e l'utilizzo di Hearth Pass trattiamo i dati necessari a:<\u002Fp>\n        <ul>\n          <li>registrare l'acquisto e attivare il Pass;<\u002Fli>\n          <li>verificarne la validità e registrare gli utilizzi presso le attività partecipanti;<\u002Fli>\n          <li>fornire assistenza;<\u002Fli>\n          <li>adempiere agli obblighi amministrativi e fiscali.<\u002Fli>\n        <\u002Ful>\n        <p>Quando il pagamento avviene tramite uno store o un fornitore di servizi di pagamento, i dati dello strumento di pagamento sono trattati da tale soggetto secondo la propria informativa; Hearth riceve le informazioni necessarie a registrare e gestire l'acquisto.<\u002Fp>\n      <\u002Fsection>\n\n      <section id=\"sito\" aria-labelledby=\"h-sito\">\n        <h2 id=\"h-sito\"><span class=\"n\">08<\u002Fspan><span>Sito web e altri servizi<\u002Fspan><\u002Fh2>\n        <h3>Navigazione<\u002Fh3>\n        <p>Durante la navigazione su hearth.travel i sistemi che ospitano il sito possono registrare dati tecnici, come indirizzo IP, data e ora della richiesta, pagina richiesta e tipo di browser, per erogare le pagine e garantirne la sicurezza.<\u002Fp>\n        <h3>Richieste di contatto<\u002Fh3>\n        <p>Quando ci scrivi via email o WhatsApp, o ci invii una richiesta attraverso il sito, trattiamo i dati che ci fornisci per risponderti e, se richiesto, per preparare una proposta o fornirti il servizio.<\u002Fp>\n        <h3>Servizi online, iniziative ed eventi<\u002Fh3>\n        <p>Se ti registri a un servizio online di Hearth o partecipi a un'iniziativa organizzata da Hearth, trattiamo i dati necessari a gestire la registrazione o la partecipazione.<\u002Fp>\n        <p>Alcuni strumenti, come le mappe e le pagine degli eventi, possono raccogliere dati per conto di organizzatori o Comuni. In questi casi il ruolo di Hearth dipende dal singolo servizio (vedi la sezione <a href=\"#ambito\">Ambito di applicazione<\u002Fa>) e il titolare del trattamento è indicato nel servizio stesso.<\u002Fp>\n      <\u002Fsection>\n\n      <section id=\"basi\" aria-labelledby=\"h-basi\">\n        <h2 id=\"h-basi\"><span class=\"n\">09<\u002Fspan><span>Finalità e basi giuridiche<\u002Fspan><\u002Fh2>\n        <div class=\"tbl\" role=\"region\" aria-label=\"Tabella finalità e basi giuridiche\" tabindex=\"0\">\n          <table>\n            <thead><tr><th scope=\"col\">Finalità<\u002Fth><th scope=\"col\">Dati<\u002Fth><th scope=\"col\">Base giuridica<\u002Fth><\u002Ftr><\u002Fthead>\n            <tbody>\n              <tr><td>Creazione e gestione dell'account, autenticazione<\u002Ftd><td>Identificativi e di account, tecnici<\u002Ftd><td>Esecuzione del contratto e misure precontrattuali, art. 6.1.b<\u002Ftd><\u002Ftr>\n              <tr><td>Erogazione dei servizi e delle funzionalità richieste<\u002Ftd><td>Account, contenuti, utilizzo<\u002Ftd><td>Esecuzione del contratto, art. 6.1.b<\u002Ftd><\u002Ftr>\n              <tr><td>Gestione, revisione e pubblicazione dei contenuti dei Creator<\u002Ftd><td>Account, contenuti<\u002Ftd><td>Esecuzione del contratto con il Creator, art. 6.1.b<\u002Ftd><\u002Ftr>\n              <tr><td>Pubblicazione di contenuti che ritraggono o raccontano altre persone<\u002Ftd><td>Immagine, voce, informazioni nel racconto<\u002Ftd><td>Legittimo interesse di Hearth a documentare e valorizzare territori e mestieri, art. 6.1.f, valutato caso per caso rispetto ai diritti della persona; consenso, art. 6.1.a, quando richiesto<\u002Ftd><\u002Ftr>\n              <tr><td>Missioni, wallet e liquidazione dei compensi<\u002Ftd><td>Account, economici e fiscali<\u002Ftd><td>Esecuzione del contratto, art. 6.1.b<\u002Ftd><\u002Ftr>\n              <tr><td>Acquisto, attivazione e utilizzo di Hearth Pass<\u002Ftd><td>Account, acquisti, utilizzo<\u002Ftd><td>Esecuzione del contratto, art. 6.1.b<\u002Ftd><\u002Ftr>\n              <tr><td>Adempimenti contabili e fiscali<\u002Ftd><td>Economici e fiscali<\u002Ftd><td>Obbligo legale, art. 6.1.c<\u002Ftd><\u002Ftr>\n              <tr><td>Assistenza e risposta alle richieste<\u002Ftd><td>Account, comunicazioni<\u002Ftd><td>Esecuzione del contratto o misure precontrattuali, art. 6.1.b<\u002Ftd><\u002Ftr>\n              <tr><td>Sicurezza dei servizi e prevenzione di abusi e frodi<\u002Ftd><td>Tecnici, account, utilizzo<\u002Ftd><td>Legittimo interesse a proteggere i servizi, gli utenti e la società, art. 6.1.f<\u002Ftd><\u002Ftr>\n              <tr><td>Diagnostica, correzione degli errori, misura delle prestazioni<\u002Ftd><td>Tecnici<\u002Ftd><td>Legittimo interesse a mantenere le applicazioni funzionanti e stabili, art. 6.1.f<\u002Ftd><\u002Ftr>\n              <tr><td>Funzionalità basate sulla posizione<\u002Ftd><td>Posizione<\u002Ftd><td>Esecuzione del contratto per la funzionalità richiesta, art. 6.1.b, o consenso, art. 6.1.a, ove la funzionalità lo richieda<\u002Ftd><\u002Ftr>\n              <tr><td>Comunicazioni promozionali, se previste<\u002Ftd><td>Email, preferenze<\u002Ftd><td>Consenso, art. 6.1.a, revocabile in qualsiasi momento<\u002Ftd><\u002Ftr>\n              <tr><td>Accertamento, esercizio o difesa di un diritto<\u002Ftd><td>Dati pertinenti al caso<\u002Ftd><td>Legittimo interesse, art. 6.1.f<\u002Ftd><\u002Ftr>\n            <\u002Ftbody>\n          <\u002Ftable>\n        <\u002Fdiv>\n        <p>Quando il trattamento si basa sul legittimo interesse puoi opporti in qualsiasi momento per motivi connessi alla tua situazione particolare. Quando si basa sul consenso puoi revocarlo in qualsiasi momento, senza pregiudicare la liceità del trattamento effettuato prima della revoca.<\u002Fp>\n      <\u002Fsection>\n\n      <section id=\"destinatari\" aria-labelledby=\"h-destinatari\">\n        <h2 id=\"h-destinatari\"><span class=\"n\">10<\u002Fspan><span>Fornitori e destinatari<\u002Fspan><\u002Fh2>\n        <p>I dati possono essere trattati, nei limiti di quanto necessario, da:<\u002Fp>\n        <ul>\n          <li>fornitori di servizi cloud, di archiviazione e di hosting;<\u002Fli>\n          <li>fornitori di sistemi di autenticazione;<\u002Fli>\n          <li>fornitori di servizi di diagnostica e di monitoraggio delle prestazioni;<\u002Fli>\n          <li>store e fornitori di servizi di pagamento;<\u002Fli>\n          <li>consulenti fiscali, contabili e legali;<\u002Fli>\n          <li>partner coinvolti nell'erogazione dei servizi, nei limiti degli accordi applicabili;<\u002Fli>\n          <li>autorità pubbliche, nei casi previsti dalla legge.<\u002Fli>\n        <\u002Ful>\n        <p>Le applicazioni Hearth utilizzano servizi Firebase forniti da Google, tra cui Firebase Crashlytics, per la raccolta dei rapporti sugli arresti anomali e sugli errori, e Firebase Performance Monitoring, per la misura delle prestazioni.<\u002Fp>\n        <p>I fornitori che trattano dati per conto di Hearth agiscono come responsabili del trattamento in base a un accordo ai sensi dell'articolo 28 GDPR. Alcuni soggetti, come gli store, i fornitori di servizi di pagamento, le autorità e alcuni partner, possono agire come titolari autonomi per i trattamenti di loro competenza, secondo le proprie informative.<\u002Fp>\n        <p>L'elenco aggiornato dei responsabili del trattamento è disponibile su richiesta all'indirizzo indicato nella sezione <a href=\"#contatti\">Contatti<\u002Fa>.<\u002Fp>\n      <\u002Fsection>\n\n      <section id=\"trasferimenti\" aria-labelledby=\"h-trasferimenti\">\n        <h2 id=\"h-trasferimenti\"><span class=\"n\">11<\u002Fspan><span>Trasferimenti internazionali<\u002Fspan><\u002Fh2>\n        <p>Alcuni fornitori possono trattare dati personali al di fuori dello Spazio Economico Europeo. In questi casi il trasferimento avviene solo nel rispetto del Capo V del GDPR: sulla base di una decisione di adeguatezza della Commissione europea per il Paese o il sistema di destinazione, oppure di garanzie adeguate ai sensi dell'articolo 46 GDPR, come le clausole contrattuali standard approvate dalla Commissione.<\u002Fp>\n        <p>Puoi chiedere informazioni sui trasferimenti e sulle garanzie adottate scrivendo all'indirizzo indicato nella sezione <a href=\"#contatti\">Contatti<\u002Fa>.<\u002Fp>\n      <\u002Fsection>\n\n      <section id=\"conservazione\" aria-labelledby=\"h-conservazione\">\n        <h2 id=\"h-conservazione\"><span class=\"n\">12<\u002Fspan><span>Conservazione dei dati<\u002Fspan><\u002Fh2>\n        <p>Conserviamo i dati per periodi diversi in base alla finalità. Dove non è possibile indicare un termine fisso, indichiamo il criterio che lo determina.<\u002Fp>\n        <div class=\"tbl\" role=\"region\" aria-label=\"Tabella conservazione dei dati\" tabindex=\"0\">\n          <table>\n            <thead><tr><th scope=\"col\">Dati<\u002Fth><th scope=\"col\">Criterio di conservazione<\u002Fth><\u002Ftr><\u002Fthead>\n            <tbody>\n              <tr><td>Account<\u002Ftd><td>Per la durata dell'account. Dopo la cancellazione i dati vengono eliminati o resi anonimi, salvo quelli che devono essere conservati per le finalità indicate nelle righe seguenti.<\u002Ftd><\u002Ftr>\n              <tr><td>Contenuti dei Creator<\u002Ftd><td>Per la durata dell'account e degli accordi che ne regolano l'utilizzo. Per la gestione in caso di cancellazione dell'account vedi la sezione 13.<\u002Ftd><\u002Ftr>\n              <tr><td>Missioni<\u002Ftd><td>Per la durata della Missione e, successivamente, per il tempo necessario a gestire verifiche, contestazioni e compensi, oltre che per gli obblighi fiscali collegati.<\u002Ftd><\u002Ftr>\n              <tr><td>Wallet, pagamenti, documentazione contabile e fiscale<\u002Ftd><td>Per il periodo previsto dalla normativa civilistica e fiscale, ordinariamente dieci anni dall'ultima registrazione (art. 2220 c.c.).<\u002Ftd><\u002Ftr>\n              <tr><td>Acquisti di Hearth Pass<\u002Ftd><td>Per la validità del Pass e l'eventuale assistenza; i dati dell'acquisto rilevanti a fini contabili e fiscali per il periodo previsto dalla legge.<\u002Ftd><\u002Ftr>\n              <tr><td>Richieste di assistenza e comunicazioni<\u002Ftd><td>Per il tempo necessario a gestire la richiesta e a documentarne l'esito, salvo che la comunicazione sia rilevante per un rapporto contrattuale in corso.<\u002Ftd><\u002Ftr>\n              <tr><td>Log tecnici e diagnostica<\u002Ftd><td>Per periodi limitati, necessari a garantire la sicurezza e a individuare e correggere errori, secondo i termini di conservazione dei servizi di diagnostica utilizzati.<\u002Ftd><\u002Ftr>\n              <tr><td>Dati di posizione<\u002Ftd><td>Se una funzionalità li conserva, per il tempo indicato al momento della richiesta del permesso; altrimenti sono utilizzati solo durante l'uso della funzionalità.<\u002Ftd><\u002Ftr>\n              <tr><td>Comunicazioni promozionali<\u002Ftd><td>Fino alla revoca del consenso.<\u002Ftd><\u002Ftr>\n            <\u002Ftbody>\n          <\u002Ftable>\n        <\u002Fdiv>\n        <p>I dati possono essere conservati più a lungo quando è necessario per accertare, esercitare o difendere un diritto, per il tempo strettamente necessario.<\u002Fp>\n      <\u002Fsection>\n\n      <section id=\"cancellazione\" aria-labelledby=\"h-cancellazione\">\n        <h2 id=\"h-cancellazione\"><span class=\"n\">13<\u002Fspan><span>Cancellazione dell'account<\u002Fspan><\u002Fh2>\n        <div class=\"callout\">\n          <span class=\"note\">Procedura e informazioni<\u002Fspan>\n          <a class=\"big\" href=\"Hearth Delete Account.html\">hearth.travel/delete-account<\u002Fa>\n        <\u002Fdiv>\n        <p>Puoi chiedere in qualsiasi momento la cancellazione del tuo account Hearth e dei dati personali associati. Alla cancellazione eliminiamo o rendiamo anonimi i dati dell'account. Possiamo conservare alcuni dati solo quando esiste un obbligo o un'altra base giuridica valida, ad esempio la documentazione contabile e fiscale relativa a compensi e acquisti, o i dati necessari alla difesa di un diritto, e solo per il tempo indicato nella sezione <a href=\"#conservazione\">Conservazione dei dati<\u002Fa>.<\u002Fp>\n        <h3>Contenuti dei Creator<\u002Fh3>\n        <p>La cancellazione dell'account non comporta automaticamente la permanenza online di fotografie e video. La gestione dei contenuti pubblicati tiene conto distintamente di due piani:<\u002Fp>\n        <ul>\n          <li><strong>i dati personali<\u002Fstrong>, tuoi e delle persone ritratte, per i quali si applicano i diritti previsti dal GDPR, incluso il diritto alla cancellazione;<\u002Fli>\n          <li><strong>i diritti d'autore e di utilizzazione dei contenuti<\u002Fstrong>, regolati dagli accordi effettivamente applicabili tra te e Hearth.<\u002Fli>\n        <\u002Ful>\n        <p>Nella richiesta puoi indicare come desideri che siano trattati i contenuti che hai pubblicato. Ti comunichiamo quali contenuti vengono rimossi e, se un contenuto resta disponibile in base a un accordo applicabile, come vengono trattati i dati personali che contiene, ad esempio rimuovendo il tuo nome. Nulla in questa informativa limita i tuoi diritti di cancellazione previsti dal GDPR.<\u002Fp>\n      <\u002Fsection>\n\n      <section id=\"sicurezza\" aria-labelledby=\"h-sicurezza\">\n        <h2 id=\"h-sicurezza\"><span class=\"n\">14<\u002Fspan><span>Sicurezza<\u002Fspan><\u002Fh2>\n        <p>Adottiamo misure tecniche e organizzative adeguate al rischio, ai sensi dell'articolo 32 GDPR, per proteggere i dati da accessi non autorizzati, perdita, distruzione o divulgazione: tra queste, controlli sugli accessi ai sistemi, limitazione dell'accesso ai dati alle persone che ne hanno bisogno per il proprio lavoro e scelta di fornitori che offrono garanzie adeguate.<\u002Fp>\n        <p>Nessun sistema è privo di rischi. In caso di violazione dei dati personali Hearth applica le procedure previste dagli articoli 33 e 34 GDPR.<\u002Fp>\n      <\u002Fsection>\n\n      <section id=\"diritti\" aria-labelledby=\"h-diritti\">\n        <h2 id=\"h-diritti\"><span class=\"n\">15<\u002Fspan><span>Diritti degli interessati<\u002Fspan><\u002Fh2>\n        <p>Nei limiti e alle condizioni previsti dal GDPR hai diritto di:<\u002Fp>\n        <ul>\n          <li><strong>accedere<\u002Fstrong> ai tuoi dati e ottenerne copia (art. 15);<\u002Fli>\n          <li>ottenerne la <strong>rettifica<\u002Fstrong> (art. 16);<\u002Fli>\n          <li>ottenerne la <strong>cancellazione<\u002Fstrong> (art. 17);<\u002Fli>\n          <li>ottenere la <strong>limitazione<\u002Fstrong> del trattamento (art. 18);<\u002Fli>\n          <li>ricevere i dati in un formato strutturato e trasmetterli a un altro titolare (<strong>portabilità<\u002Fstrong>, art. 20), quando il trattamento si basa sul contratto o sul consenso ed è effettuato con mezzi automatizzati;<\u002Fli>\n          <li><strong>opporti<\u002Fstrong> al trattamento basato sul legittimo interesse e, in ogni caso, al trattamento per finalità promozionali (art. 21);<\u002Fli>\n          <li><strong>revocare il consenso<\u002Fstrong> in qualsiasi momento, quando il trattamento si basa sul consenso;<\u002Fli>\n          <li>non essere sottoposto a decisioni basate unicamente su trattamenti automatizzati, nei casi previsti dall'art. 22.<\u002Fli>\n        <\u002Ful>\n        <p>Per esercitare i tuoi diritti scrivi a <a href=\"mailto:massimiliano.imbimbo@hearth.email\">massimiliano.imbimbo@hearth.email<\u002Fa>. Rispondiamo senza ingiustificato ritardo e, ordinariamente, entro un mese dal ricevimento della richiesta; il termine può essere prorogato di due mesi se necessario, tenuto conto della complessità e del numero delle richieste, come previsto dall'articolo 12 GDPR. In tal caso ti informiamo della proroga entro il primo mese. Se abbiamo dubbi ragionevoli sulla tua identità possiamo chiederti informazioni aggiuntive per confermarla.<\u002Fp>\n        <p>Hai inoltre il diritto di proporre reclamo al Garante per la protezione dei dati personali: <a href=\"https://www.garanteprivacy.it\">www.garanteprivacy.it<\u002Fa>.<\u002Fp>\n      <\u002Fsection>\n\n      <section id=\"minori\" aria-labelledby=\"h-minori\">\n        <h2 id=\"h-minori\"><span class=\"n\">16<\u002Fspan><span>Minori<\u002Fspan><\u002Fh2>\n        <h3>Utenti minorenni<\u002Fh3>\n        <p>I requisiti di età per l'utilizzo dei singoli servizi sono indicati nelle condizioni applicabili a ciascun servizio. Ai sensi dell'articolo 2-quinquies del Codice Privacy, per i servizi della società dell'informazione offerti direttamente, il consenso al trattamento può essere prestato autonomamente dal minore che ha compiuto quattordici anni; al di sotto di questa età, quando il trattamento si basa sul consenso, è necessario il consenso di chi esercita la responsabilità genitoriale. Le funzionalità che comportano compensi o rapporti economici richiedono la capacità di agire prevista dalla legge.<\u002Fp>\n        <h3>Minori presenti nei contenuti<\u002Fh3>\n        <p>I contenuti che ritraggono minori sono valutati con particolare attenzione durante la verifica editoriale e non vengono pubblicati senza il consenso di chi esercita la responsabilità genitoriale, quando necessario. Un genitore o tutore può chiedere in qualsiasi momento la rimozione di un contenuto che ritrae un minore scrivendo all'indirizzo indicato nella sezione <a href=\"#contatti\">Contatti<\u002Fa>.<\u002Fp>\n      <\u002Fsection>\n\n      <section id=\"cookie\" aria-labelledby=\"h-cookie\">\n        <h2 id=\"h-cookie\"><span class=\"n\">17<\u002Fspan><span>Cookie e tecnologie analoghe<\u002Fspan><\u002Fh2>\n        <p>Il sito hearth.travel non utilizza cookie di profilazione né strumenti di analisi statistica o di tracciamento di terze parti. Le pagine possono utilizzare esclusivamente strumenti tecnici necessari al loro funzionamento, che non richiedono il consenso.<\u002Fp>\n        <p>Se in futuro introdurremo strumenti non necessari, come cookie analitici non anonimizzati o di profilazione, li attiveremo solo dopo aver raccolto il tuo consenso attraverso un apposito sistema di gestione e aggiorneremo questa informativa, con un'informativa cookie dedicata.<\u002Fp>\n        <p>Le applicazioni Hearth utilizzano gli strumenti di diagnostica descritti nella sezione <a href=\"#destinatari\">Fornitori e destinatari<\u002Fa>.<\u002Fp>\n      <\u002Fsection>\n\n      <section id=\"automatizzate\" aria-labelledby=\"h-automatizzate\">\n        <h2 id=\"h-automatizzate\"><span class=\"n\">18<\u002Fspan><span>Decisioni automatizzate<\u002Fspan><\u002Fh2>\n        <p>L'eventuale utilizzo di strumenti automatici o di intelligenza artificiale per assistere la scrittura, l'organizzazione o la revisione dei contenuti non costituisce, di per sé, una decisione basata unicamente su un trattamento automatizzato ai sensi dell'articolo 22 GDPR.<\u002Fp>\n        <p>Qualora un servizio Hearth adotti decisioni basate unicamente su un trattamento automatizzato che producano effetti giuridici o incidano in modo analogo significativamente su di te, ti forniremo informazioni sulla logica utilizzata, sull'importanza e sulle conseguenze previste del trattamento e sul diritto di ottenere l'intervento umano, esprimere la tua opinione e contestare la decisione.<\u002Fp>\n      <\u002Fsection>\n\n      <section id=\"modifiche\" aria-labelledby=\"h-modifiche\">\n        <h2 id=\"h-modifiche\"><span class=\"n\">19<\u002Fspan><span>Modifiche dell'informativa<\u002Fspan><\u002Fh2>\n        <p>Possiamo aggiornare questa informativa per modifiche normative, tecniche o relative ai servizi. La data dell'ultimo aggiornamento è indicata in testa al documento. Le modifiche sostanziali vengono comunicate agli utenti, quando necessario, attraverso i servizi o via email.<\u002Fp>\n      <\u002Fsection>\n\n      <section id=\"contatti\" aria-labelledby=\"h-contatti\">\n        <h2 id=\"h-contatti\"><span class=\"n\">20<\u002Fspan><span>Contatti<\u002Fspan><\u002Fh2>\n        <dl class=\"facts\">\n          <dt>Titolare<\u002Fdt><dd>Hearth S.r.l. Società Benefit<\u002Fdd>\n          <dt>Sede legale<\u002Fdt><dd>III Traversa Via Alvanella n. 4, 83024 Monteforte Irpino (AV), Italia<\u002Fdd>\n          <dt>P. IVA e C.F.<\u002Fdt><dd>02960700645<\u002Fdd>\n          <dt>Richieste privacy<\u002Fdt><dd><a href=\"mailto:massimiliano.imbimbo@hearth.email\">massimiliano.imbimbo@hearth.email<\u002Fa><\u002Fdd>\n          <dt>PEC<\u002Fdt><dd><a href=\"mailto:hearth@pec.net\">hearth@pec.net<\u002Fa><\u002Fdd>\n          <dt>Cancellazione account<\u002Fdt><dd><a href=\"Hearth Delete Account.html\">hearth.travel/delete-account<\u002Fa><\u002Fdd>\n        <\u002Fdl>\n      <\u002Fsection>\n    <\u002Farticle>\n  <\u002Fdiv>\n<\u002Fmain>\n\n<footer class=\"wrap\">\n  <div class=\"foot\">\n    <span>Hearth S.r.l. Società Benefit · P. IVA 02960700645 · © 2026<\u002Fspan>\n    <nav aria-label=\"Link di servizio\">\n      <a href=\"Hearth Homepage.dc.html\">Homepage<\u002Fa>\n      <a href=\"Hearth Privacy.html\" aria-current=\"page\">Privacy Policy<\u002Fa>\n      <a href=\"Hearth Delete Account.html\">Cancellazione account<\u002Fa>\n    <\u002Fnav>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n\n<\u002Fbody><\u002Fhtml>"
